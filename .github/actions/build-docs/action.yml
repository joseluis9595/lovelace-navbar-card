name: Build Docs
description: Build the Material for MkDocs documentation site

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: docs/requirements.txt

    - shell: bash
      working-directory: ./docs
      run: pip install -r requirements.txt

    - shell: bash
      working-directory: ./docs
      run: mkdocs build --strict
